<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img"
     aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="t">PC 결제창 결제 흐름도</title>
  <desc id="d">구매자, 가맹점 서버, 토스페이먼츠 사이에서 결제 정보 입력부터 최종 승인 결과 수신까지 8단계로 진행됩니다.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3182f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8b95a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .lane  { fill:#f2f4f6; stroke:#e5e8eb; }
    .lane-mid { fill:#e8f3ff; stroke:#c9e2ff; }
    .lane-t{ font-size:13.5px; font-weight:600; fill:#191f28; }
    .life  { stroke:#e5e8eb; stroke-width:1.5; stroke-dasharray:3 5; }
    .flow  { stroke:#3182f6; stroke-width:1.6; fill:none; }
    .flow-g{ stroke:#8b95a1; stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
    .num   { font-size:11.5px; font-weight:700; fill:#fff; }
    .numbg { fill:#3182f6; }
    .numbg-g { fill:#8b95a1; }
    .lbl   { font-size:12.5px; fill:#191f28; }
    .page  { font-size:11.5px; fill:#1b64da; font-family:Consolas,Menlo,monospace; }
    .note  { font-size:11px; fill:#8b95a1; }
  </style>

  <!-- 레인 머리글 -->
  <rect class="lane"     x="20"  y="16" width="170" height="34" rx="6"/>
  <text class="lane-t" x="105" y="38" text-anchor="middle">구매자</text>
  <rect class="lane-mid" x="305" y="16" width="170" height="34" rx="6"/>
  <text class="lane-t" x="390" y="38" text-anchor="middle">가맹점 서버</text>
  <rect class="lane"     x="590" y="16" width="170" height="34" rx="6"/>
  <text class="lane-t" x="675" y="38" text-anchor="middle">토스페이먼츠</text>

  <!-- 생명선 -->
  <line class="life" x1="105" y1="56" x2="105" y2="576"/>
  <line class="life" x1="390" y1="56" x2="390" y2="576"/>
  <line class="life" x1="675" y1="56" x2="675" y2="576"/>

  <!-- ① 구매자 → 가맹점 -->
  <text class="lbl" x="247" y="88" text-anchor="middle">결제 정보 입력</text>
  <text class="page" x="247" y="103" text-anchor="middle">sample_crossplatform</text>
  <line class="flow" x1="105" y1="114" x2="382" y2="114" marker-end="url(#a)"/>
  <circle class="numbg" cx="105" cy="114" r="9"/><text class="num" x="105" y="118" text-anchor="middle">1</text>

  <!-- ② 가맹점 내부 -->
  <text class="lbl" x="500" y="152" text-anchor="start">인증 요청 정보 구성</text>
  <text class="page" x="500" y="167" text-anchor="start">payreq_crossplatform</text>
  <path class="flow" d="M390 146 H470 V174 H398" marker-end="url(#a)"/>
  <circle class="numbg" cx="390" cy="146" r="9"/><text class="num" x="390" y="150" text-anchor="middle">2</text>

  <!-- ③ 가맹점 → 토스 -->
  <text class="lbl" x="532" y="204" text-anchor="middle">통합결제창 호출</text>
  <line class="flow" x1="390" y1="220" x2="667" y2="220" marker-end="url(#a)"/>
  <circle class="numbg" cx="390" cy="220" r="9"/><text class="num" x="390" y="224" text-anchor="middle">3</text>

  <!-- ④ 토스 ↔ 구매자 -->
  <text class="lbl" x="390" y="256" text-anchor="middle">결제수단 선택 · 추가 정보 입력 · 인증</text>
  <line class="flow-g" x1="667" y1="272" x2="113" y2="272" marker-start="url(#b)" marker-end="url(#b)"/>
  <circle class="numbg-g" cx="675" cy="272" r="9"/><text class="num" x="675" y="276" text-anchor="middle">4</text>

  <!-- ⑤ 토스 → 가맹점 -->
  <text class="lbl" x="532" y="308" text-anchor="middle">인증키 전달</text>
  <text class="page" x="532" y="323" text-anchor="middle">LGD_PAYKEY → returnurl</text>
  <line class="flow" x1="675" y1="334" x2="398" y2="334" marker-end="url(#a)"/>
  <circle class="numbg" cx="675" cy="334" r="9"/><text class="num" x="675" y="338" text-anchor="middle">5</text>

  <!-- ⑥ 가맹점 내부 -->
  <text class="lbl" x="500" y="372" text-anchor="start">인증 결과 전달</text>
  <text class="page" x="500" y="387" text-anchor="start">payres</text>
  <path class="flow" d="M390 366 H470 V394 H398" marker-end="url(#a)"/>
  <circle class="numbg" cx="390" cy="366" r="9"/><text class="num" x="390" y="370" text-anchor="middle">6</text>

  <!-- ⑦ 가맹점 → 토스 -->
  <text class="lbl" x="532" y="424" text-anchor="middle">최종 승인 요청</text>
  <text class="page" x="532" y="439" text-anchor="middle">XPayClient · PaymentByKey</text>
  <line class="flow" x1="390" y1="450" x2="667" y2="450" marker-end="url(#a)"/>
  <circle class="numbg" cx="390" cy="450" r="9"/><text class="num" x="390" y="454" text-anchor="middle">7</text>

  <!-- ⑧ 토스 → 가맹점 -->
  <text class="lbl" x="532" y="488" text-anchor="middle">승인 결과 응답</text>
  <text class="page" x="532" y="503" text-anchor="middle">LGD_RESPCODE</text>
  <line class="flow" x1="675" y1="514" x2="398" y2="514" marker-end="url(#a)"/>
  <circle class="numbg" cx="675" cy="514" r="9"/><text class="num" x="675" y="518" text-anchor="middle">8</text>

  <!-- 하단 주석 -->
  <line x1="20" y1="544" x2="760" y2="544" stroke="#e5e8eb" stroke-width="1"/>
  <text class="note" x="20" y="564">파란 실선은 서버 간 통신, 회색 점선은 구매자와 결제창 사이의 화면 상호작용입니다.</text>
  <text class="note" x="20" y="580">⑤ returnurl 은 payreq_crossplatform 의 자식 페이지이며, 부모의 payment_return 함수로 인증키를 전달합니다.</text>
</svg>
